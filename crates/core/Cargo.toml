[package]
name = "elemental-core"
documentation = "https://docs.rs/elemental-core"
description = "Core library for Elemental, providing common utilities and abstractions used across the project."

version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[features]
default = []
yggdrasil-auth = ["dep:nidhogg"]
offline-server = ["yggdrasil-auth", "nidhogg/server"]

[dependencies]
async-trait = { workspace = true }
dirs = { workspace = true }
elemental-schema = { path = "../schema", version = "0.2.0" }
erased-serde = { workspace = true }
futures = { workspace = true }
md-5 = "0.11.0"
minecraft-msa-auth = "0.5.0"
nidhogg = { workspace = true, optional = true }
oauth2 = { version = "5.0.0", default-features = false }
oauth2-reqwest = { version = "0.1.0-alpha.3" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = "0.3"
uuid = { version = "1.19.0", features = ["serde", "v4", "v5"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
