[package]
name = "elemental-infra"
documentation = "https://docs.rs/elemental-infra"
description = "Infrastructure library for Elemental, providing some infra objects such as downloaders, file utilities, and other common tools used across the project."

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["tls-aws-lc"]
tls-aws-lc = ["elemental-core/tls-aws-lc", "reqwest/rustls"]
tls-rustls-no-provider = ["elemental-core/tls-rustls-no-provider", "reqwest/rustls-no-provider"]
tls-native = ["elemental-core/tls-native", "reqwest/native-tls"]
tls-native-vendored = ["elemental-core/tls-native-vendored", "reqwest/native-tls-vendored"]
serde = ["dep:serde", "uuid/serde"]

[dependencies]
async-trait = { workspace = true }
elemental-core = { path = "../core", version = "0.3.0", default-features = false, features = ["http"] }
futures = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, optional = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7.17", default-features = false, features = ["rt"] }
uuid = { workspace = true, features = ["v4"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
