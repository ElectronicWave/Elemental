[package]
name = "elemental-kit"
documentation = "https://docs.rs/elemental-kit"
description = "Elemental is a modular, extensible Minecraft instance management and modding framework written in Rust, designed to provide a unified interface for launching, managing, and modding Minecraft across different platforms and modloader ecosystems."
readme = "../../README.md"

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
core = ["dep:elemental-core"]
http = ["core", "elemental-core/http"]

shared = ["dep:elemental-shared"]
shared-json = ["shared", "elemental-shared/json"]
shared-toml = ["shared", "elemental-shared/toml"]

driver = ["dep:elemental-driver", "core", "http", "infra", "schema", "shared"]
launcher = ["dep:elemental-launcher", "core", "http", "driver", "infra"]

tls-aws-lc = [
    "elemental-core?/tls-aws-lc",
    "elemental-driver?/tls-aws-lc",
    "elemental-infra?/tls-aws-lc",
    "elemental-launcher?/tls-aws-lc",
]
tls-rustls-no-provider = [
    "elemental-core?/tls-rustls-no-provider",
    "elemental-driver?/tls-rustls-no-provider",
    "elemental-infra?/tls-rustls-no-provider",
    "elemental-launcher?/tls-rustls-no-provider",
]
tls-native = [
    "elemental-core?/tls-native",
    "elemental-driver?/tls-native",
    "elemental-infra?/tls-native",
    "elemental-launcher?/tls-native",
]
tls-native-vendored = [
    "elemental-core?/tls-native-vendored",
    "elemental-driver?/tls-native-vendored",
    "elemental-infra?/tls-native-vendored",
    "elemental-launcher?/tls-native-vendored",
]

driver-all = [
    "driver-fabric",
    "driver-legacyfabric",
    "driver-babric",
    "driver-quilt",
    "driver-liteloader",
    "driver-rift",
    "driver-forge",
    "driver-cleanroom",
    "driver-outlands",
    "driver-neoforge",
]
driver-fabric = ["launcher", "elemental-launcher/driver-fabric", "elemental-driver/fabric"]
driver-legacyfabric = [
    "launcher",
    "elemental-launcher/driver-legacyfabric",
    "elemental-driver/legacyfabric",
]
driver-babric = [
    "launcher",
    "elemental-launcher/driver-babric",
    "elemental-driver/babric",
]
driver-quilt = ["launcher", "elemental-launcher/driver-quilt", "elemental-driver/quilt"]
driver-liteloader = [
    "launcher",
    "elemental-launcher/driver-liteloader",
    "elemental-driver/liteloader",
]
driver-rift = ["launcher", "elemental-launcher/driver-rift", "elemental-driver/rift"]
driver-forge = ["launcher", "elemental-launcher/driver-forge", "elemental-driver/forge"]
driver-cleanroom = [
    "launcher",
    "elemental-launcher/driver-cleanroom",
    "elemental-driver/cleanroom",
]
driver-outlands = [
    "launcher",
    "elemental-launcher/driver-outlands",
    "elemental-driver/outlands",
]
driver-neoforge = [
    "launcher",
    "elemental-launcher/driver-neoforge",
    "elemental-driver/neoforge",
]

microsoft-auth = [
    "core",
    "http",
    "elemental-core/microsoft-auth",
    "elemental-launcher?/microsoft-auth",
]
yggdrasil-auth = [
    "core",
    "launcher",
    "elemental-core/yggdrasil-auth",
    "elemental-launcher/yggdrasil-auth",
]
authlib-injector-embed = ["yggdrasil-auth", "elemental-launcher/authlib-injector-embed"]
offline-server = ["yggdrasil-auth", "elemental-launcher/offline-server"]

object = ["dep:elemental-object"]
object-notify = ["object", "elemental-object/notify"]

infra = ["dep:elemental-infra", "http"]
infra-serde = ["infra", "elemental-infra/serde"]

schema = ["dep:elemental-schema"]

full = [
    "driver",
    "launcher",
    "driver-all",
    "microsoft-auth",
    "object",
    "shared",
    "core",
    "infra",
    "schema",
]

default = ["full", "shared-json", "object-notify", "tls-aws-lc"]

[dependencies]
elemental-core = { path = "../core", version = "0.3.0", optional = true, default-features = false }
elemental-driver = { path = "../driver", version = "0.3.0", optional = true, default-features = false }
elemental-infra = { path = "../infra", version = "0.3.0", optional = true, default-features = false }
elemental-launcher = { path = "../launcher", version = "0.3.0", optional = true, default-features = false }
elemental-object = { path = "../object", version = "0.3.0", optional = true, default-features = false }
elemental-schema = { path = "../schema", version = "0.3.0", optional = true, default-features = false }
elemental-shared = { path = "../shared", version = "0.3.0", optional = true, default-features = false }
