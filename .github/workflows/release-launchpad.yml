name: Release Launchpad

on:
  release:
    types: [ "published" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            exe_suffix: ""

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Build launchpad
        run: cargo build -p launchpad --release

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          asset="launchpad-${TAG}-${{ matrix.target }}${{ matrix.exe_suffix }}"
          cp "target/release/launchpad${{ matrix.exe_suffix }}" "dist/${asset}"
          echo "ASSET_NAME=${asset}" >> "$GITHUB_ENV"

      - name: Upload asset to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/$ASSET_NAME" --clobber
