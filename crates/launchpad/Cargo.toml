[package]
name = "launchpad"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.23", features = ["derive"] }
elemental = { package = "elemental-kit", path = "../elemental", default-features = false, features = [
    "core",
    "driver",
    "infra",
    "launcher",
] }
indicatif = { version = "0.18.6", default-features = false, features = [
    "unicode-width",
] }
inquire = { version = "0.9.4", default-features = false, features = [
    "crossterm",
    "fuzzy",
] }
tokio = { workspace = true }
