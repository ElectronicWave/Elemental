[package]
name = "launchpad"
version = "0.3.0"
edition = "2024"

[features]
default = ["driver-all"]
driver-all = [
    "driver-vanilla",
    "driver-fabric",
    "driver-legacyfabric",
    "driver-babric",
    "driver-quilt",
    "driver-liteloader",
    "driver-rift",
    "driver-forge",
    "driver-cleanroom",
    "driver-outlands",
    "driver-neoforge",
]
driver-vanilla = ["elemental/driver-vanilla"]
driver-fabric = ["elemental/driver-fabric"]
driver-legacyfabric = ["elemental/driver-legacyfabric"]
driver-babric = ["elemental/driver-babric"]
driver-quilt = ["elemental/driver-quilt"]
driver-liteloader = ["elemental/driver-liteloader"]
driver-rift = ["elemental/driver-rift"]
driver-forge = ["elemental/driver-forge"]
driver-cleanroom = ["elemental/driver-cleanroom"]
driver-outlands = ["elemental/driver-outlands"]
driver-neoforge = ["elemental/driver-neoforge"]

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.23", features = ["derive"] }
elemental = { package = "elemental-kit", path = "../elemental", default-features = false, features = [
    "core",
    "driver",
    "infra",
    "launcher",
] }
indicatif = { version = "0.18.6", default-features = false, features = [
    "unicode-width",
] }
inquire = { version = "0.9.4", default-features = false, features = [
    "crossterm",
    "fuzzy",
] }
tokio = { workspace = true }
