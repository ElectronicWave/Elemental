[package]
name = "elemental-core"
documentation = "https://docs.rs/elemental-core"
description = "Core library for Elemental, providing common utilities and abstractions used across the project."

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["microsoft-auth", "tls-aws-lc"]
microsoft-auth = [
    "dep:base64",
    "dep:minecraft-msa-auth",
    "dep:oauth2",
    "dep:oauth2-reqwest",
    "dep:reqwest",
    "dep:serde_json",
    "reqwest/json",
    "reqwest/multipart",
]
tls-aws-lc = ["reqwest?/rustls", "nidhogg?/tls-aws-lc"]
tls-rustls-no-provider = ["reqwest?/rustls-no-provider", "nidhogg?/tls-rustls-no-provider"]
tls-native = ["reqwest?/native-tls", "nidhogg?/tls-native"]
tls-native-vendored = ["reqwest?/native-tls-vendored", "nidhogg?/tls-native-vendored"]
yggdrasil-auth = ["dep:nidhogg"]
offline-server = ["yggdrasil-auth", "nidhogg/server"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
dirs = { workspace = true }
erased-serde = { workspace = true }
futures = { workspace = true }
md-5 = "0.11.0"
minecraft-msa-auth = { version = "0.5.0", optional = true }
nidhogg = { workspace = true, optional = true }
oauth2 = { version = "5.0.0", default-features = false, optional = true }
oauth2-reqwest = { version = "0.1.0-alpha.3", optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1.44"
uuid = { version = "1.19.0", features = ["serde", "v4", "v5"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
