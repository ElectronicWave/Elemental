[package]
name = "elemental-driver"
documentation = "https://docs.rs/elemental-driver"
description = "Driver library for Elemental, providing implementations for interacting with different modloaders and game versions."

version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
elemental-core = { path = "../core", version = "0.3.0", default-features = false }
elemental-infra = { path = "../infra", version = "0.3.0" }
elemental-schema = { path = "../schema", version = "0.3.0" }
elemental-shared = { path = "../shared", version = "0.3.0" }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { version = "0.42.0", default-features = false, optional = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["driver-all"]
maven-xml = ["dep:quick-xml"]
driver-all = [
    "fabric",
    "legacyfabric",
    "babric",
    "quilt",
    "liteloader",
    "rift",
    "forge",
    "cleanroom",
    "outlands",
    "neoforge",
]
fabric = []
legacyfabric = ["fabric"]
babric = ["fabric"]
quilt = []
liteloader = ["maven-xml"]
rift = []
forge = ["maven-xml"]
cleanroom = ["retrofutura"]
outlands = ["retrofutura"]
neoforge = ["maven-xml"]
retrofutura = ["maven-xml"]
