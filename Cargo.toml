[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/driver",
    "crates/elemental",
    "crates/infra",
    "crates/launcher",
    "crates/launchpad",
    "crates/object",
    "crates/schema",
    "crates/shared",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/ElectronicWave/Elemental"
homepage = "https://github.com/ElectronicWave/Elemental"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = { version = "1.0.100" }
async-trait = "0.1.89"
dirs = { version = "7" }
futures = "0.3.32"
hex = "0.4.3"
jiff = { version = "0.2.0", features = ["serde"] }
reqwest = { version = "0.13.1", features = ["json", "stream", "default-tls"] }
scc = { version = "3.4.8", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.48.0", features = [
    "rt",
    "macros",
    "fs",
    "io-util",
    "rt-multi-thread",
    "process",
    "sync",
    "time",
] }
toml = "1.0.0"

# https://github.com/microsoft/edit/blob/main/Cargo.toml
# `opt-level = "s"` significantly reduces binary size.
# `#[optimize(speed)]` can be used for spot optimizations, but does not work
# on intrinsics such as memset.
[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # keeps release artifacts debuggable
lto = true                  # reduces binary size by ~14%
opt-level = "s"             # reduces binary size by ~25%
panic = "abort"             # reduces binary size when combined with panic_immediate_abort
split-debuginfo = "packed"  # emits a separate *.dwp/*.dSYM so the binary can be stripped
strip = "symbols"           # see split-debuginfo; drops symbols from the executable
incremental = true          # improves re-compile times
